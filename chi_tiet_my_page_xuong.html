<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SportsRAB CMS - 공장 마이페이지</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 5px; }
    .field-row { display: grid; grid-template-columns: 94px minmax(0, 1fr); gap: 10px; align-items: start; }
    .field-label { color: #858585; font-size: 12px; line-height: 1.55; }
    .field-value { color: #242424; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
    .drawer-shadow { box-shadow: 0 12px 36px rgba(0,0,0,.18); }
    /* Factory image block: 368x184 */
    .factory-image-block { width: 368px; max-width: 100%; height: 184px; display: flex; align-items: center; justify-content: center; border: 1px solid #e7e7e7; border-radius: 6px; background: #e9e9e9; color: #a3a3a3; overflow: hidden; }
    .factory-image-block img { width: 100%; height: 100%; object-fit: cover; display: block; }
    @media (max-width: 640px) {
      #drawer-backdrop { padding: 0; }
      #drawer-container { max-width: none; height: 100dvh; border-radius: 0; }
      .field-row { grid-template-columns: 82px minmax(0, 1fr); }
      .info-grid { grid-template-columns: minmax(0, 1fr); }
      .factory-image-block { width: 100%; height: auto; aspect-ratio: 2/1; }
    }
  </style>
</head>
<body class="min-h-screen bg-[#f7f8fa] text-[#171717] antialiased">
  <!-- CMS background preview -->
  <div class="flex h-screen overflow-hidden">
    <aside class="flex w-44 shrink-0 flex-col justify-between bg-[#1f5fba] text-white">
      <div>
        <div class="flex h-10 items-center gap-2 border-b border-white/10 px-3">
          <div class="bg-black px-1.5 py-1 text-[8px] font-black leading-[9px] tracking-tight">SPORTS<br>RAB</div>
          <span class="text-[13px] font-bold tracking-tight">SportsRAB CMS</span>
        </div>
        <nav class="space-y-0.5 p-2.5 text-xs font-medium">
          <a href="#" class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85"><i data-lucide="layout-dashboard" class="h-3.5 w-3.5"></i>대시보드</a>
          <a href="#" class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85"><i data-lucide="shopping-bag" class="h-3.5 w-3.5"></i>주문 관리</a>
          <a href="#" class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85"><i data-lucide="palette" class="h-3.5 w-3.5"></i>디자인 목록 관리</a>
          <a href="#" class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85"><i data-lucide="truck" class="h-3.5 w-3.5"></i>제작 및 배송 관리</a>
          <a href="#" class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85"><i data-lucide="factory" class="h-3.5 w-3.5"></i>공장 관리</a>
          <a href="#" class="mt-1 flex items-center gap-2.5 rounded bg-white px-2.5 py-2 font-semibold text-[#1f5fba]"><i data-lucide="building-2" class="h-3.5 w-3.5"></i>마이페이지</a>
        </nav>
      </div>
      <div class="border-t border-white/10 p-3"><button class="flex items-center gap-2 text-xs opacity-90"><i data-lucide="log-out" class="h-3.5 w-3.5"></i>로그아웃</button></div>
    </aside>
    <main class="flex min-w-0 flex-1 flex-col">
      <header class="flex h-10 shrink-0 items-center justify-between bg-[#1f5fba] px-4 text-white">
        <span class="text-xs font-semibold">공장 관리 시스템</span>
        <button onclick="toggleDrawer(true)" class="flex items-center gap-2 rounded px-2 py-1 hover:bg-white/10">
          <span class="flex h-6 w-6 items-center justify-center rounded-full bg-white/20 text-xs font-semibold">공</span>
          <span class="text-xs font-medium">테스트 공장 2</span><i data-lucide="chevron-down" class="h-3.5 w-3.5"></i>
        </button>
      </header>
      <section class="flex flex-1 items-start justify-center p-8">
        <div class="mt-20 max-w-sm text-center">
          <div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-blue-50 text-[#1f5fba]"><i data-lucide="factory" class="h-7 w-7"></i></div>
          <h1 class="mb-2 text-base font-bold">공장 관리 시스템</h1>
          <p class="mb-5 text-xs leading-5 text-gray-500">공장 계정으로 로그인하여 제작 및 배송이 필요한 주문을 관리할 수 있습니다.</p>
          <button onclick="toggleDrawer(true)" class="rounded bg-[#1f5fba] px-4 py-2.5 text-xs font-semibold text-white hover:bg-[#174e9d]">마이페이지 열기</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Factory My Page drawer -->
  <div id="drawer-backdrop" class="fixed inset-0 z-50 flex justify-end bg-black/35 p-4 transition-opacity duration-200">
    <section id="drawer-container" role="dialog" aria-modal="true" aria-labelledby="drawer-title" class="drawer-shadow flex h-[calc(100vh-32px)] w-full max-w-[620px] translate-x-0 flex-col overflow-hidden rounded-xl bg-white transition-transform duration-200">
      <header class="flex h-10 shrink-0 items-center justify-between border-b border-[#e5e5e5] bg-[#f1f1f1] px-4">
        <h2 id="drawer-title" class="text-sm font-bold text-[#222]">마이페이지</h2>
        <button aria-label="닫기" onclick="toggleDrawer(false)" class="rounded p-1 text-[#333] hover:bg-black/5"><i data-lucide="x" class="h-4 w-4"></i></button>
      </header>

      <div class="flex-1 space-y-4 overflow-y-auto p-4 sm:p-5">
        <!-- Factory identity and account action -->
        <section class="flex flex-col items-center border-b border-gray-100 pb-5">
          <div class="factory-image-block">
            <i data-lucide="factory" class="h-10 w-10"></i>
          </div>
          <h3 class="mt-3 text-base font-bold text-[#171717]">테스트 공장 2</h3>
          <button type="button" onclick="showPasswordNotice()" class="mt-3 inline-flex items-center gap-2 rounded-md border border-[#1f5fba] bg-white px-3.5 py-2 text-xs font-semibold text-[#1f5fba] transition hover:bg-[#f1f6ff] focus:outline-none focus:ring-2 focus:ring-[#1f5fba]/20">
            <i data-lucide="lock-keyhole" class="h-3.5 w-3.5"></i>
            비밀번호 변경
          </button>
        </section>

        <!-- Details are based on the information entered by Admin in 공장 목록 관리 -->
        <section class="rounded-lg border border-[#ededed] bg-white p-4">
          <div class="mb-3 flex items-center gap-2">
            <span class="flex h-7 w-7 items-center justify-center rounded-md bg-[#edf4fd] text-[#1f5fba]"><i data-lucide="building-2" class="h-4 w-4"></i></span>
            <h3 class="text-sm font-bold text-[#174f9e]">공장 정보</h3>
          </div>
          <div class="info-grid grid grid-cols-2 gap-x-6 gap-y-3.5">
            <div class="field-row"><span class="field-label">공장명</span><span class="field-value font-medium">테스트 공장 2</span></div>
            <div class="field-row"><span class="field-label">사업자등록번호</span><span class="field-value">123-81-45678</span></div>
            <div class="field-row"><span class="field-label">대표자</span><span class="field-value">김공장</span></div>
            <div class="field-row"><span class="field-label">연락처</span><span class="field-value">031-123-4567</span></div>
            <div class="field-row col-span-full"><span class="field-label">이메일</span><span class="field-value">factory02@example.com</span></div>
            <div class="field-row col-span-full"><span class="field-label">주소</span><span class="field-value">경기도 안산시 단원구 공단로 2 (원시동, 테스트 테크노타운 101호)</span></div>
          </div>
        </section>


      </div>

      <footer class="flex h-16 shrink-0 items-center justify-center gap-2 border-t border-[#e8e8e8] bg-white px-4">
        <button onclick="toggleDrawer(false)" class="min-w-[112px] rounded border border-[#c8c8c8] bg-white px-5 py-2 text-xs font-semibold text-[#333] hover:bg-gray-50">닫기</button>
        <button onclick="showEditNotice()" class="min-w-[112px] rounded bg-[#064db5] px-5 py-2 text-xs font-semibold text-white hover:bg-[#03429d]">수정</button>
      </footer>
    </section>
  </div>

  <script>
    lucide.createIcons();
    function toggleDrawer(isOpen) {
      const backdrop = document.getElementById('drawer-backdrop');
      const container = document.getElementById('drawer-container');
      if (isOpen) {
        backdrop.classList.remove('pointer-events-none', 'opacity-0');
        backdrop.classList.add('pointer-events-auto', 'opacity-100');
        container.classList.remove('translate-x-6', 'opacity-0');
        container.classList.add('translate-x-0', 'opacity-100');
      } else {
        backdrop.classList.remove('pointer-events-auto', 'opacity-100');
        backdrop.classList.add('pointer-events-none', 'opacity-0');
        container.classList.remove('translate-x-0', 'opacity-100');
        container.classList.add('translate-x-6', 'opacity-0');
      }
    }
    function showEditNotice() {
      alert('공장 정보 수정 기능은 실제 시스템의 수정 화면과 연결해 주세요.');
    }
    function showPasswordNotice() {
      alert('비밀번호 변경 기능은 실제 시스템의 비밀번호 변경 화면과 연결해 주세요.');
    }
    document.getElementById('drawer-backdrop').addEventListener('click', function(e) {
      if (e.target === this) toggleDrawer(false);
    });
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') toggleDrawer(false);
    });
  </script>
</body>
</html>
