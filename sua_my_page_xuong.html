<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SportsRAB CMS - 공장 마이페이지 수정</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box}body{font-family:'Pretendard',-apple-system,BlinkMacSystemFont,system-ui,sans-serif}::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:5px}.form-label{display:block;margin-bottom:6px;font-size:12px;font-weight:600;color:#555}.form-input{width:100%;border:1px solid #d5d8de;border-radius:5px;padding:9px 10px;font-size:13px;color:#222;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s}.form-input:focus{border-color:#1f5fba;box-shadow:0 0 0 3px rgba(31,95,186,.10)}.required{color:#d14343}.drawer-shadow{box-shadow:0 12px 36px rgba(0,0,0,.18)}

/* Image block: kích thước cố định 368x184 */
.image-block{position:relative;width:368px;max-width:100%;height:184px;border:1px solid #e7e7e7;border-radius:6px;background:#e9e9e9;display:flex;align-items:center;justify-content:center;color:#a3a3a3;overflow:hidden}
.image-block img{width:100%;height:100%;object-fit:cover;display:block}
.image-edit-btn{position:absolute;right:8px;bottom:8px;width:32px;height:32px;border-radius:9999px;background:#fff;border:1px solid #e2e2e2;color:#333;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.18);cursor:pointer;transition:background .15s,transform .15s}
.image-edit-btn:hover{background:#f3f4f6;transform:scale(1.05)}

@media(max-width:640px){#drawer-backdrop{padding:0}#drawer-container{height:100dvh;max-width:none;border-radius:0}.form-grid{grid-template-columns:minmax(0,1fr)}.image-block{width:100%;height:auto;aspect-ratio:2/1}}
</style>
</head>
<body class="min-h-screen bg-[#f7f8fa] text-[#171717] antialiased">
<div class="flex h-screen overflow-hidden">
 <aside class="flex w-44 shrink-0 flex-col justify-between bg-[#1f5fba] text-white"><div><div class="flex h-10 items-center gap-2 border-b border-white/10 px-3"><div class="bg-black px-1.5 py-1 text-[8px] font-black leading-[9px]">SPORTS<br>RAB</div><span class="text-[13px] font-bold">SportsRAB CMS</span></div><nav class="space-y-0.5 p-2.5 text-xs font-medium"><a class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85" href="#"><i data-lucide="layout-dashboard" class="h-3.5 w-3.5"></i>대시보드</a><a class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85" href="#"><i data-lucide="shopping-bag" class="h-3.5 w-3.5"></i>주문 관리</a><a class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85" href="#"><i data-lucide="palette" class="h-3.5 w-3.5"></i>디자인 목록 관리</a><a class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85" href="#"><i data-lucide="truck" class="h-3.5 w-3.5"></i>제작 및 배송 관리</a><a class="flex items-center gap-2.5 rounded px-2.5 py-2 opacity-85" href="#"><i data-lucide="factory" class="h-3.5 w-3.5"></i>공장 관리</a><a class="mt-1 flex items-center gap-2.5 rounded bg-white px-2.5 py-2 font-semibold text-[#1f5fba]" href="#"><i data-lucide="building-2" class="h-3.5 w-3.5"></i>마이페이지</a></nav></div><div class="border-t border-white/10 p-3"><button class="flex items-center gap-2 text-xs opacity-90"><i data-lucide="log-out" class="h-3.5 w-3.5"></i>로그아웃</button></div></aside>
 <main class="flex min-w-0 flex-1 flex-col"><header class="flex h-10 shrink-0 items-center justify-between bg-[#1f5fba] px-4 text-white"><span class="text-xs font-semibold">공장 관리 시스템</span><div class="flex items-center gap-2"><span class="flex h-6 w-6 items-center justify-center rounded-full bg-white/20 text-xs font-semibold">공</span><span class="text-xs font-medium">테스트 공장 2</span></div></header><section class="flex flex-1 items-start justify-center p-8"><div class="mt-20 max-w-sm text-center"><div class="mx-auto mb-4 flex h-14 w-14 items-center justify-center rounded-xl bg-blue-50 text-[#1f5fba]"><i data-lucide="factory" class="h-7 w-7"></i></div><h1 class="mb-2 text-base font-bold">공장 관리 시스템</h1><p class="mb-5 text-xs leading-5 text-gray-500">공장 계정으로 로그인하여 제작 및 배송이 필요한 주문을 관리할 수 있습니다.</p><button onclick="openEdit()" class="rounded bg-[#1f5fba] px-4 py-2.5 text-xs font-semibold text-white hover:bg-[#174e9d]">마이페이지 수정 열기</button></div></section></main>
</div>
<div id="drawer-backdrop" class="fixed inset-0 z-50 flex justify-end bg-black/35 p-4 transition-opacity duration-200">
<section id="drawer-container" role="dialog" aria-modal="true" aria-labelledby="drawer-title" class="drawer-shadow flex h-[calc(100vh-32px)] w-full max-w-[680px] translate-x-0 flex-col overflow-hidden rounded-xl bg-white transition-transform duration-200">
<header class="flex h-11 shrink-0 items-center justify-between border-b border-[#e5e5e5] bg-[#f1f1f1] px-5"><div><h2 id="drawer-title" class="text-sm font-bold">마이페이지 수정</h2></div><button aria-label="닫기" onclick="closeEdit()" class="rounded p-1 text-[#333] hover:bg-black/5"><i data-lucide="x" class="h-4 w-4"></i></button></header>
<form id="edit-form" class="flex min-h-0 flex-1 flex-col" onsubmit="saveChanges(event)">
<div class="flex-1 space-y-4 overflow-y-auto p-4 sm:p-5">

<!-- ===== Ảnh xưởng 368x184 + bút + tên + nút mật khẩu ===== -->
<section class="flex flex-col items-center border-b border-gray-100 pb-5">
  <div id="image-block" class="image-block">
    <i data-lucide="factory" class="h-10 w-10"></i>
    <label for="factory-image" class="image-edit-btn" title="이미지 변경">
      <i data-lucide="pencil" class="h-4 w-4"></i>
    </label>
    <input id="factory-image" type="file" accept="image/*" class="hidden" onchange="previewImage(event)">
  </div>
  <h3 class="mt-3 text-base font-bold text-[#171717]">테스트 공장 2</h3>
  <button type="button" onclick="showPasswordNotice()" class="mt-3 inline-flex items-center gap-2 rounded-md border border-[#c8c8c8] bg-white px-3.5 py-2 text-xs font-semibold text-[#333] transition hover:bg-gray-50">
    <i data-lucide="shield-check" class="h-3.5 w-3.5"></i>
    비밀번호 변경
  </button>
</section>

<div class="rounded-lg border border-[#ededed] p-4"><div class="mb-4 flex items-center gap-2"><span class="flex h-7 w-7 items-center justify-center rounded-md bg-[#edf4fd] text-[#1f5fba]"><i data-lucide="building-2" class="h-4 w-4"></i></span><h3 class="text-sm font-bold text-[#174f9e]">공장 정보</h3></div>
<div class="form-grid grid grid-cols-2 gap-x-4 gap-y-4">
<div><label class="form-label" for="factory-name">공장명 <span class="required">*</span></label><input class="form-input" id="factory-name" name="factoryName" value="테스트 공장 2" required maxlength="100"></div>
<div><label class="form-label" for="business-number">사업자등록번호 <span class="required">*</span></label><input class="form-input" id="business-number" name="businessNumber" value="123-81-45678" required inputmode="numeric" maxlength="20"></div>
<div><label class="form-label" for="representative">대표자 <span class="required">*</span></label><input class="form-input" id="representative" name="representative" value="김공장" required maxlength="50"></div>
<div><label class="form-label" for="phone">연락처 <span class="required">*</span></label><input class="form-input" id="phone" name="phone" value="031-123-4567" required inputmode="tel" maxlength="30"></div>
<div class="col-span-full"><label class="form-label" for="email">이메일 <span class="required">*</span></label><input class="form-input" id="email" name="email" type="email" value="factory02@example.com" required maxlength="150"></div>
<div class="col-span-full"><label class="form-label" for="address">주소 <span class="required">*</span></label><input class="form-input" id="address" name="address" value="경기도 안산시 단원구 공단로 2 (원시동, 테스트 테크노타운 101호)" required maxlength="250"></div>
</div></div>

<div id="notice" class="hidden rounded-md border border-[#cfe0fa] bg-[#f3f7ff] px-3 py-2.5 text-xs text-[#174f9e]" role="status"></div>
</div>
<footer class="flex shrink-0 items-center justify-center gap-2 border-t border-[#e8e8e8] bg-white px-4 py-3 sm:px-5">
  <button type="button" onclick="cancelEdit()" class="min-w-[100px] rounded border border-[#c8c8c8] bg-white px-5 py-2.5 text-xs font-semibold text-[#333] hover:bg-gray-50">취소</button>
  <button type="submit" class="min-w-[112px] rounded bg-[#064db5] px-5 py-2.5 text-xs font-semibold text-white hover:bg-[#03429d]">저장</button>
</footer>
</form></section></div>
<div id="toast" class="pointer-events-none fixed bottom-5 left-1/2 z-[60] hidden -translate-x-1/2 rounded-md bg-[#202a36] px-4 py-3 text-xs font-medium text-white shadow-lg"></div>
<script>
lucide.createIcons();
const backdrop=document.getElementById('drawer-backdrop');
const container=document.getElementById('drawer-container');
let savedValues={};
let imageUrl=null;

function openEdit(){
  backdrop.classList.remove('pointer-events-none','opacity-0');
  backdrop.classList.add('pointer-events-auto','opacity-100');
  container.classList.remove('translate-x-6','opacity-0');
  container.classList.add('translate-x-0','opacity-100');
  savedValues=captureValues();
}
function closeEdit(){
  backdrop.classList.remove('pointer-events-auto','opacity-100');
  backdrop.classList.add('pointer-events-none','opacity-0');
  container.classList.remove('translate-x-0','opacity-100');
  container.classList.add('translate-x-6','opacity-0');
}
function captureValues(){
  return Object.fromEntries([...document.querySelectorAll('#edit-form input:not([type=file])')].map(el=>[el.id,el.value]));
}
function restoreValues(){
  Object.entries(savedValues).forEach(([id,value])=>{
    const el=document.getElementById(id);
    if(el) el.value=value;
  });
}
function cancelEdit(){restoreValues();closeEdit();}
function saveChanges(e){
  e.preventDefault();
  const form=document.getElementById('edit-form');
  if(!form.reportValidity()) return;
  const data=captureValues();
  document.getElementById('factory-name').value=data['factory-name'];
  showToast('변경 사항이 저장되었습니다. (프로토타입)');
  savedValues=data;
  closeEdit();
}
function previewImage(e){
  const file=e.target.files&&e.target.files[0];
  if(!file) return;
  if(imageUrl) URL.revokeObjectURL(imageUrl);
  imageUrl=URL.createObjectURL(file);
  const block=document.getElementById('image-block');
  const editBtn=block.querySelector('.image-edit-btn');
  const input=document.getElementById('factory-image');
  block.innerHTML='';
  const img=document.createElement('img');
  img.src=imageUrl;
  img.alt='공장 이미지 미리보기';
  block.appendChild(img);
  block.appendChild(editBtn);
  block.appendChild(input);
  lucide.createIcons();
}
function showPasswordNotice(){
  showToast('비밀번호 변경 기능은 실제 시스템의 비밀번호 변경 화면과 연결해 주세요.');
}
function showToast(message){
  const el=document.getElementById('toast');
  el.textContent=message;
  el.classList.remove('hidden');
  setTimeout(()=>el.classList.add('hidden'),2600);
}
backdrop.addEventListener('click',e=>{if(e.target===backdrop)cancelEdit();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')cancelEdit();});
savedValues=captureValues();
</script>
</body></html>
